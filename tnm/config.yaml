# TNM (Trading News Monitor) 기본 설정.
# 시크릿은 .env 로만 주입한다 (DART_API_KEY, TNM_DB_DSN 등 — settings.py 참조).
# 계수·임계 등 튜닝값은 여기서 바꾸고 PR 리뷰를 거친다 (요청서 P4: 룰 기반·결정론).

watch:
  sync_interval_min: 30        # 트레이딩 감시목록·보유계좌 동기화 주기
  corp_code_refresh_days: 7    # DART corpCode.xml 갱신 주기

collect:
  dart:
    market_interval_min: 10    # 장중(09:00-16:00 평일)
    off_interval_min: 60       # 장외
    initial_days: 30           # 종목별 모드 최초 수집 범위 (M2 판정: 30일치 중복 0)
    # 전종목 모드 — list.json 은 corp_code 없이 날짜 범위만 주면 전체 공시를 준다.
    # 종목별 모드는 감시 65종목 = 65콜/사이클이고 종목이 늘면 그대로 늘어난다.
    # 전종목 모드는 목록 몇 콜로 끝나고 종목 수와 무관하다. false 면 종전 방식.
    market_mode: true
    market_initial_days: 3     # 커서 없을 때 소급 범위(전종목이라 넓게 잡지 않는다)
    # 감시목록 밖 공시에서 신규 종목 발굴 (discover.py).
    # 종전에는 사이클마다 ~1,120건을 세기만 하고 버렸다 — 그래서 뉴스 소스가
    # 원리적으로 새 종목을 낼 수 없었다.
    discover:
      enabled: true
      max_per_cycle: 10     # 등록할수록 RSS 폴링이 늘어난다 — 사이클당 상한
      max_total: 300        # dart 출처 관심종목 총량 상한
      tier: other           # 12시간 주기. 'trade'(30분)로 넣으면 호출이 폭증한다
  news:
    interval_min: 30           # 루프 주기 — 실제 종목별 주기는 tier_interval_min
    fetch_body: true           # 기사 링크 본문 추출(trafilatura) — 실패 시 요약 폴백
    initial_days: 7            # 첫 수집(커서 없음) 시 최근 N일만 — 백로그 방지
    # 계층별 수집 주기(분). 구글 RSS 는 종목명 검색이라 종목당 1콜이 강제돼
    # 전종목이 불가능하다(3,900종목 ÷ 30분 = 초당 2.2요청 — 차단당한다).
    # 대신 매매 대상은 자주, 그 외는 드물게 본다. tier 는 트레이딩 감시목록의
    # collect_only 에서 동기화된다.
    tier_interval_min:
      trade: 30                # 매매 대상
      collect: 120             # 수집전용
      other: 720               # 그 외(뉴스 발굴 등)
  # 증권사 리서치 리포트. 수집 대상 증권사는 DB(tnm_brokers)가 소유하고 화면에서
  # 토글한다 — 여기 있는 것은 '어느 소스를 몇 페이지나 볼 것인가' 뿐이다.
  research:
    enabled: true
    interval_min: 60
    naver_enabled: true        # 네이버 금융 리서치 (5분류, EUC-KR)
    consensus_enabled: true    # 한경컨센서스 (목표가·투자의견이 목록에 함께 온다)
    pages: 1                   # 네이버 분류당 페이지 수(페이지당 30건)
    days: 3                    # 한경컨센서스 소급 일수
    # 네이버 종목분석은 목표가·투자의견이 상세에만 있어 리포트당 1콜이 더 든다.
    # 못 채운 건은 목표가만 null 로 남고 나머지 정보는 온전하다.
    detail_max_per_cycle: 20
    # 해외 증권사는 리포트 원문이 공개돼 있지 않다. 국내 언론 인용 기사만
    # 구글 RSS 로 모은다(증권사당 1콜) — 원문이 아니라는 것을 화면에도 적는다.
    foreign_enabled: true
    foreign_max_per_cycle: 12
    initial_days: 3            # 해외 인용 기사 첫 수집 소급 범위

dedup:
  duplicate_threshold: 0.92    # 이상 → duplicate (LLM 생략)
  follow_up_threshold: 0.85    # 이상 → follow_up (감점 계수)
  window_days: 7               # 동일 종목 비교 범위

llm:
  classify_role: "classify_news"   # 공유 LLM 게이트웨이 역할 (모델은 roles.yaml 소유)
  primary_model: "qwen2.5:32b"     # (직접 호출 폴백용 참고값 — 게이트웨이 경유가 기본)
  fallback_model: "qwen2.5:14b"
  embed_model: "bge-m3"
  temperature: 0.1
  num_ctx: 8192
  timeout_sec: 120
  max_body_chars: 6000

score:                         # 요청서 6장 — 결정론적 산식 계수
  # research(증권사 리포트)는 뉴스보다 높고 공시보다 낮다. 애널리스트가 이름을
  # 걸고 쓴 분석이라 재탕 기사보다 무겁지만, 공시처럼 사실 확정은 아니다.
  w_source: {dart: 1.0, research: 0.85, naver: 0.7, rss: 0.7}
  w_category:
    실적: 1.0
    공급계약: 1.0
    증설투자: 1.0
    자금조달: 1.0
    소송규제: 1.0
    # 거래정지는 보유 중이면 청산 자체가 불가능해지는 사건이라 최고 가중.
    # 정정공시는 앞선 공시의 내용이 바뀌었다는 뜻이라 원본만큼 중요하다.
    # 이 둘은 alerts.urgent_categories 로도 지정돼 조용시간에도 즉시 발송된다.
    거래정지: 1.0
    정정공시: 1.0
    지배구조: 0.8
    인사: 0.8
    시황해설: 0.4
    단순재탕: 0.2
    기타: 0.2
  w_novelty: {new: 1.0, follow_up: 0.5, duplicate: 0.0}
  non_material_factor: 0.5     # is_material=false 감점

alerts:
  default_threshold: 60        # 종목별 미지정 시 기본 임계값
  default_daily_cap: 5         # 종목별 일일 알림 상한
  quiet_start: "22:00"         # 조용시간 시작 (익일 07:00 묶음 발송)
  quiet_end: "07:00"
  urgent_categories: [정정공시, 거래정지]   # 조용시간에도 즉시 발송
  shadow_mode: true            # true 면 어떤 조건에도 발송하지 않고 기록만 (M8 전환 시 false)

# 고점수 뉴스·공시 종목의 트레이딩 감시목록 편입 — **수집전용으로만**.
# 뉴스 점수는 아직 검증되지 않았다(Shadow 라벨링 2주 미완, 점수×수익률 이벤트
# 스터디 미실시). 검증 전 신호로 매매하는 것은 발굴 3규칙에서 이미 겪은 실수다.
# 지금 하는 일은 데이터를 먼저 쌓는 것뿐이고, 매매 tier 승격은 측정을 통과한 뒤
# 사람이 결정한다.
promote:
  enabled: true
  min_score: 70          # 알림 기본 임계(60)보다 높게 — 편입은 알림보다 보수적으로
  window_hours: 24       # 최근 N시간 내 분석만
  max_per_run: 5         # 사이클당 편입 상한(감시목록 급팽창 방지)
  interval_min: 60
