# 감시 종목 (종목코드: 메모) — 소액 계좌로 실제 매수 가능하도록 저가·고유동 종목 위주.
# 참고: config 의 watchlist 는 DB 가 비었을 때 '최초 시드'로만 쓰인다(운영 기준은 DB).
watchlist:
  "010140": 삼성중공업
  "011200": HMM
  "003490": 대한항공
  "047040": 대우건설
  "034220": LG디스플레이
  "073240": 금호타이어
  "060250": NHN KCP
  "064260": 다날
# 숏 신호를 인버스 ETF 매수로 집행할 때 사용할 매핑.
# 주의: long_only=true(롱 전용) 이면 숏 신호를 아예 발주하지 않으므로 이 값은 미사용.
inverse_etf: "114800"   # KODEX 인버스 (지수 하락 베팅용 — 롱 전용에선 미사용)

# 인버스 ETF 목록 — 하락장 수익 vehicle(매수=지수 하락 베팅). 감시목록에 매매로
# 편입해 두면 롱 규칙이 그대로 잡는다. 국면 게이트가 강세장 매수를 막는다.
inverse_etfs: ["114800", "251340", "252670"]
# 시장 국면 게이트: 강세장에선 인버스 ETF 매수 신호를 보류(지수 상승 시 인버스 하락).
# 국면은 야간 발굴의 전일 breadth(60일선 상회 비율)로 계산됨(강세/약세/중립).
regime_gate:
  enabled: true
  inverse_block_regime: "강세"   # 이 (유효)국면일 때 인버스 매수 차단
  # 유효 국면 = 전일 breadth(기준) + 당일 시가갭 보정 + 야간리포트(미국장) 편향
  use_open_gap: true             # 당일 시가 갭 방향으로 ±1 보정
  open_gap_th: 0.5               # 감시목록 시가갭 중앙값 임계(%)
  use_night_bias: true           # 야간 리포트가 남긴 익일 편향(night_bias.json) 반영
  # 인버스 발주 우선권 (사용자 결정 2026-08-03 — 하락장 수익 최우선 전제).
  # 약세 유효국면에서 인버스 신호를 같은 사이클의 롱보다 먼저 발주한다.
  # 근거: 실거래에서 인버스가 유일한 누적 흑자 축(6건 5승 +4,256원)인데
  # 8/3 포지션 한도 경쟁에서 롱에 밀려 미발주 실측. 측정 검증 전 적용임을
  # 명시 — breadth 국면 예측력은 소급 194일 기준 미달(measurement.md).
  # 국면 채점(score_first) 적중률로 사후 평가한다.
  inverse_priority: true
  inverse_priority_regimes: ["약세"]

# 급등주 스캐너: 거래대금상위(ka10032)에서 등락률·거래대금·가격 필터 교차
scanner:
  enabled: true
  market: "000"          # 000 전체 / 001 코스피 / 101 코스닥
  min_change_pct: 3.0    # 당일 등락률 최소 (하락장 주도주 = 지수 역행 상승)
  min_trade_value: 10000 # trde_prica 와 같은 단위(통상 백만원 → 100억). 실호출로 단위 검증할 것
  min_price: 1000        # 저가주 제외
  top_n: 10
  # 감시목록 직접 편입(auto_watch)은 2026-08-01 완전 통합에서 **삭제** —
  # 편입은 발굴 엔진(scout)의 단일 통로다. VolumeSource 가 이 필터를 재사용한다.
  # 매매 tier 가격 상한 — 자산 동기화 전 폴백값(이후엔 자산×종목당 비중 상한).
  trade_max_price: 30000
  # 급등 '조짐' (거래량급증 ka10023): 거래량이 터졌는데 가격은 아직인 종목
  # ka10023 `sdnin_rt` 은 '직전 조회의 **누적** 거래량 대비 증가율(%)' 이다.
  # 실측 2026-07-30: prev 174,076 → now 184,076 · sdnin_qty +10,000 · sdnin_rt 5.74.
  # 분모가 누적이라 장중에 300% 는 도달 불가 — 종전 300.0 은 구조적으로 통과 0이었고
  # 이 소스는 7/28 이후 신호를 하나도 내지 못했다(그전 3,144건은 개장 직후 분모 0인
  # 쓰레기값). 문턱은 잡음 하한으로만 두고 상위 선택은 top_n 이 한다.
  min_volume_surge_pct: 0.5    # 거래량 급증률 최소 (%)
  change_pct_min: -1.0         # 등락률 범위 — 이미 급등한 종목은 위 스캐너 몫
  change_pct_max: 3.0
  # 문서 정합 관측(연구 문서 2026-08-01 §2.3) — "3분봉 거래량 10만~15만 주
  # 이상 급증". 우리 세기(sdnin_rt)와 정의가 달라 신호 evidence 에 둘 다
  # 남긴다(vol_3min·doc_surge). 판정에는 쓰지 않는다 — 4주 뒤 어느 정의가
  # 실현 R 과 상관있는지 가른 뒤에 정한다.
  doc_surge_shares: 100000

# KOSPI 급등률 상위(ka10027) 실시간 조회 + 저가주 자동 감시편입
gainers:
  enabled: true
  # 코스피만 보면 변동성 큰 코스닥 급등주가 구조적으로 안 들어온다.
  # (실측 2026-07-24: 일중변동 상위 20 중 감시 중이던 종목 2개)
  markets: ["001", "101"]  # 001 코스피 · 101 코스닥
  market: "001"            # 하위호환 — markets 가 있으면 무시된다
  min_price: 1000              # 저가주 하한(동전주 제외)
  # 유동성 하한 — 거래량×현재가 근사(원). 낮게 두면 거래대금 3~10억짜리가 편입돼
  # 소액 주문에도 시장 충격이 난다(실측 2026-07-27: 매매대상 38종목 중 6종목이
  # 10억 미만, 대부분 이 경로). 30억.
  min_trade_value_krw: 3000000000
  # 매매 tier 가격 상한 — 자산이 동기화되면 '자산 × 종목당 비중 상한'(1주라도
  # 살 수 있는 최고가)이 대신 쓰인다. 아래 값은 동기화 전 폴백.
  # 고정 3만원이면 계좌가 커져도 후보가 늘지 않는다(실측: gainer 15중 11이 수집전용).
  trade_max_price: 30000
  top_n: 15               # 편입 상위 종목 수 (편입은 엔진 경유 — 직접 쓰기 삭제)

# 야간 배치(발굴 엔진의 전종목 수집 팔, scout/nightly.py): 평일 17:30 KST.
# 2026-08-01 완전 폐기 이관 — 독립 모듈 discovery 는 없다. 섹션 이름도 함께
# 바꿨다(discovery → nightly). DB 파일명(discovery.db)과 무작위 시드 문자열은
# 데이터 연속성 때문에 그대로다.
nightly:
  enabled: true                 # 야간 **배치** 스위치 (수집·표본 선정)
  # 엔진 소비자(NightlySource) 스위치 — 배치와 별개다. 배치를 하루 꺼도
  # 전날 picks 는 계속 신호로 올라간다(감사 2026-08-01 분리).
  source_enabled: true
  vol_surge_ratio: 3.0          # 전일 거래량 ≥ 20일 평균 × N
  near_high_ratio: 0.97         # 60일 고가 대비 종가 비율
  min_price: 1000
  min_trade_value_krw: 1000000000  # 전일 거래대금 최소 (10억 원)
  # ⚠️ 이 두 값이 만드는 '점수 표본' 은 **측정상 대조군보다 나쁘다.**
  # 변동성 정합 대조군(같은 날 atr_pct 최근접) 대비, 보통주 497,773행 / 195일 /
  # 손절 2.5%: 상위 20 -0.151R(t=-7.04) · 2점 이상 -0.168R(t=-10.70) ·
  # 3점 만점 -0.238R(t=-5.23). **점수가 높을수록 더 나쁘다(단조).**
  #
  # **2026-08-01: top_n 20 -> 5.** 지우지 않는 이유는 무작위 표본과의 실거래
  # 대조에 기준선이 필요해서다 — 4주면 약 100건이라 판정에 충분하다. 20 을
  # 유지할 이유는 없다: 실제 산출은 min_score 가 묶어 하루 8건이었고, 그 8건이
  # t=-10.70 으로 대조군보다 나쁜 채 감시목록·매매로 갔다. 노출을 40% 줄인다.
  #
  # min_score 를 올리지 않는 것도 측정 때문이다 — 3점 만점이 가장 나빴다.
  # 문턱을 올리면 더 나쁜 쪽만 남는다.
  min_score: 2                  # 3규칙 중 최소 충족 수 (점수 표본에만 적용)
  top_n: 5                      # 점수 표본 상한 (기준선용 — 위 주석 참조)
  # 무작위 표본 — 유동성 통과 유니버스에서 매일 N종목을 추가로 뽑는다.
  # 실측 2026-07-31 유입 깔때기: 상장 3,925 → 유동성 1,165 → min_score 2점 이상
  # **8종목**. 전종목 평가 경로가 하루 8건을 내놓았고 5거래일 실거래 50종목 중
  # 이 경로 기여는 7종목이었다. 나머지는 전부 '상위 N' API 라 같은 종목이 돈다.
  #
  # 늘린 자리를 점수 순으로 채우지 않는 이유는 1.5단계 실측이다 —
  # 무작위 -0.184R · 매수가능 무작위 -0.283R · 현행 점수 -0.502R ·
  # 차트지표 합성(WF) -0.683R. 어느 랭킹도 무작위를 못 이겼다.
  # 부수 효과로 점수 표본 vs 무작위 표본의 실거래 대조군이 생긴다(picks.pick_kind).
  # 0 이면 종전 동작(점수 표본만).
  random_fill: 40
  # 조건식 표본 — 세 번째 팔. **0 = 꺼짐이 기본값이다.**
  #
  # 만든 근거는 "외부 문서 조건식이 우리 랭킹 중 유일하게 무작위를 이겼다"
  # (-0.135R vs -0.304R) 였다. 그 표본의 **87.4%가 금리형·머니마켓 ETF** 였다 —
  # 매일 0.01%씩 오르니 항상 신고가·항상 이평 위·항상 정배열이다. ETF 를 빼도
  # 격차는 남았지만(-0.094R vs -0.244R · t=+6.48), 통과 상위가 KT&G·기업은행·
  # KT·우리금융지주라 한 겹 더 파 보니 `atr_pct` 3.04% (유동성 전체 6.87%) 였다.
  #
  #   같은 날 **비슷한 변동성** 종목 무작위를 대조군으로 두면
  #     100억  -0.094R vs -0.124R  격차 +0.030R  t=+0.70
  #      10억  -0.180R vs -0.182R  격차 +0.001R  t=+0.07   → 0 과 구분되지 않는다
  #
  # 종목을 고른 게 아니라 베타를 줄인 것이고, 표본 195일이 하락 편중이라 유리했다.
  # 게다가 우리 진입 규칙(ORB·모멘텀)은 변동성을 먹고 사는데 이 조건식은
  # 저변동성만 고른다 — 최근 20거래일 통과가 총 3건(0인 날 17일)이라 켜도
  # 4주 뒤 판정할 체결이 안 쌓인다.
  #
  # 되살리려면 0 이 아닌 값을 주면 된다(nightly.screen_fill). 다만 **변동성 정합 대조군을 이기는가**를
  # 먼저 통과시킬 것 — 그냥 무작위를 이기는 것으로는 부족하다는 게 이 측정이다.
  screen_fill: 0
  screen:
    require_ma_aligned: true          # 5 > 20 > 60 정배열 (보통주 기준 기여 ≈ 0)
    disparity_max_pct: 5              # |종가/20일이평 × 100 - 100| ≤ 5 (기여 최대)
    near_high60_min: 95               # 60일 고가 대비 %
    # 백테스트는 20일 평균 거래대금을 썼는데 `features.py` 에는 당일 값만 있어
    # 근사한다. 보통주 기준으로는 이 축도 기여한다(-0.094 → 제외 시 -0.183) —
    # "100억이나 10억이나 같다" 던 종전 값은 ETF 87% 표본에서 나온 것이라 폐기.
    min_trade_value_krw: 10000000000  # 100억
  max_symbols: 0                # 0 = 전종목 (테스트 시 소수로 제한)
  # auto_watch(상위 5 직접 편입)는 2026-08-01 완전 통합에서 삭제 — 편입은
  # 엔진 단일 통로다(NightlySource 가 picks 를 신호로 올린다).
  bearish_min_score: 2          # 하락(숏) 후보 최소 점수(역배열·저점근접·60이평 하회 중)
  # 하락 후보 표시 상한 — top_n(점수 표본)과 무관하다. 종전에는 top_n 을
  # 공유해 #242 의 20→5 축소가 화면 하락 목록까지 잘랐다(감사 2026-08-01).
  bearish_top_n: 20
  regime:                       # 시장 국면 판정(60이평 상회 종목 비율=breadth 기준)
    bull_breadth: 60            # 이 이상이면 강세장
    bear_breadth: 40            # 이 이하면 약세장 (사이는 중립)
  # ETF·ETN·리츠·채권형 등 비보통주 제외 (이름 기반). 아래 비우면 기본값 사용.
  # exclude_keywords: [리츠, 스팩, ETN, ETF, 레버리지, 인버스, 선물, 채권, 국채, 금리, 액티브, 커버드콜, 배당, TR, 합성]
  # exclude_prefixes: [KODEX, TIGER, KOSEF, ARIRANG, HANARO, TIMEFOLIO, KOACT, TREX, PLUS, RISE, ACE, SOL, KBSTAR]

# 전종목 피처 데이터셋 파일 내보내기 (외부 스케줄러/분석기가 소비)
export:
  enabled: true
  keep_days: 30                 # datasets/<날짜>/ 보관 일수

# 주문체결 실시간 수신 (실측 체결가로 진입가 정밀화). FID 코드는 계정/환경마다
# 다를 수 있어 라이브 체결 로그(주문체결 수신 INFO)로 검증 후 아래 fids 를 조정한다.
execution:
  enabled: true
  rt_type: "00"                 # 주문체결 실시간 타입(계좌 스코프)
  # --- WS 수신 감시 (2026-08-01) ---
  # 실측 7/31: 연결은 살았는데 REAL 틱이 수십 분 0건(좀비) — 보유 종목 감시가
  # 통째로 REST 폴백에 빠졌다. 장중 zombie_sec 동안 전 구독 종목이 무틱이면
  # 소켓을 강제로 닫고 재접속한다(120종목 전부 15초 무체결일 확률은 사실상 0).
  ws:
    zombie_sec: 15
  # 자동 청산 — 키움 REST 는 스톱주문이 없어 서버가 감시 후 직접 발주한다.
  auto_exit: true               # false 면 청산 자동화 끔(장부 기록만)
  # 수동 청산(버튼) 발주 유형 (사용자 승인 2026-08-03). 실측: 수동 청산 9건
  # 평균 괴리 −0.32%·최악 −1.26%(021320, 시장가의 호가 잠식). best=최유리
  # 지정가 — 매수최우선호가에 지정가로 걸려 아래 호가로 밀리지 않고, 미체결
  # 잔량은 fallback_sec 뒤 취소 후 시장가 전환. market 으로 두면 종전 동작.
  # 자동 손절·eod 는 이 설정과 무관하게 시장가다(확실한 탈출이 목적).
  manual_exit:
    type: best                  # best(최유리지정가) | market(종전)
    fallback_sec: 10
  stop_mode: auto               # auto=손절 즉시 시장가 매도(B) / approve=손절도 승인(A). 목표는 항상 승인.
  # 마감 정리 시작 시각 — **장이 열려 있는 동안** 발주해야 한다.
  # 실측 2026-07-30 15:31:13: 마감 후 발주가 `[2000] 장종료되었습니다` 로 거부돼
  # 포지션이 밤을 넘겼다(다음 날 개장 5초 만에 목표가 정리, +1,359원 — 갭 하락
  # 이었으면 손실 상한이 없었다). 15:30 은 정규장이 끝나는 시각이지 발주할 수
  # 있는 시각이 아니다. 10분 창을 두면 부분 실패해도 재시도할 여유가 있다.
  eod_flat_at: "15:20"
  # --- 매매 데스크 (보유 포지션 전용 고속 청산 감시) ---
  # 보유 종목의 손절·목표를 초 단위로 보고 **데스크가 직접 발주한다.** 판정만
  # 빨라지고 발주가 30초 루프를 타면 빨라진 의미가 없다.
  # 켜져 있으면 30초 루프는 손절·목표를 보지 않는다(시간 손절·마감 정리는 유지).
  # **꺼져 있으면 손절·목표를 자동 발주하지 않고 승인 대기로 올린다**(사용자 결정
  # 2026-07-29). 30초 판정으로 시장가를 던지는 트레이드오프를 사람이 보고 정한다.
  # 가격은 이미 WS 로 실시간이라 **추가 호출이 거의 없다** — 낡은(stale_sec 초과)
  # 종목만 REST 로 보충한다.
  # 실거래 청산을 다루므로 배포와 활성화를 분리한다. 켜고 끄기는 화면 스위치
  # 또는 POST /api/desk 로 배포 없이 즉시 반영된다(data/desk.json).
  desk:
    enabled: false            # 꺼두면 기존 30초 _ledger_loop 이 그대로 맡는다
    interval_sec: 2           # 현행 30초의 15배. 1은 발주 왕복·SQLite 쓰기와 경합
    stale_sec: 5              # WS 값이 이보다 오래되면 못 믿는다 → 그 종목만 REST
    max_symbols: 0            # 0 = 보유 전량. 상한을 두면 초과분이 2초 감시 밖으로 나간다
    degraded_interval_sec: 30 # WS 미연결 시 강등 주기(REST 폭주 방지)
    # 라인 추종(사용자 지침 2026-07-29): 오르면 진입 시 정한 갭만큼 손절·목표를
    # 같이 올리고, 내려도 그 자리에 둔다. 숏은 방향이 반대다.
    trailing: true
    # 목표까지 tighten_at 만큼 왔으면, 그 뒤로는 손절선을 **상승분의
    # lock_gain_pct %** 로 잡는다(사용자 지침 2026-07-29).
    #   손절 = 진입가 + (현재가 − 진입가) × lock_gain_pct/100
    #   예) 진입 1,000 · 현재 1,200(상승 200) · 90% → 1,180
    # 값이 클수록 확정분이 커지지만 되밀림 여유가 줄어 잔진동에 먼저 걸린다.
    tighten_at: 0.5
    lock_gain_pct: 30
    # 익절선도 따라 올릴 것인가. **기본은 고정(false)** — 실거래 57건 투사에서
    # 따라 올리면 목표에 닿아 익절했을 7건이 되밀려 손절선에서 나왔다(−6,593원).
    # 손절선이 목표보다 먼저 따라붙기 때문이다. 옛 동작이 필요하면 true.
    trail_target: false
    # 익절선 천장(진입가 대비 %). 규칙에 따라 목표가 3.75% 까지 잡히는데
    # (target_r 1.5 × 손절폭 2.5%) 그때는 끌어내린다. 0이면 상한 없음.
    max_gain_pct: 3.0

  # --- 본전 이동 shadow (관측 전용) ---
  # "목표거리의 arm_at_pct% 에 닿으면 손절선을 진입가로 올렸다면 어땠을까" 를
  # 실제 청산과 나란히 기록만 한다. **매매에는 관여하지 않는다.**
  # 근거: 2026-07-28 손절 10건 중 목표거리 50% 이상 도달은 2건뿐이었다. 되돌릴
  # 수익이 실재하는 표본이 작아서, 추세 모델을 만들기 전에 값부터 만든다.
  # 20거래일 측정 후 판단한다. enabled:false 로 끄면 기록만 멈춘다 —
  # positions 를 쓰지 않으므로 되돌릴 실거래 상태가 없다(관측치는 reset()).
  breakeven_shadow:
    enabled: true
    arm_at_pct: 50              # 목표거리 도달률(%) — 이 값에 닿으면 무장
  # fids:                       # 기본값 사용. 검증 후 필요 시 덮어쓰기.
  #   ord_no: "9203"            # 주문번호
  #   symbol: "9001"            # 종목코드
  #   state:  "913"             # 주문상태(접수/체결)
  #   price:  "910"             # 체결가
  #   qty:    "911"             # 체결량
  #   ts:     "908"             # 체결시간

# 수집 로스터 — 감시목록에서 빠져도 유예기간 동안 분봉 백필을 이어가 축적
# 흐름이 끊기지 않게 한다(트레이딩 감시목록과 분리된 '수집 대상' 집합).
collection:
  # 장중 실시간 백필은 매매 대상만. 수집전용 종목은 매매하지 않으므로 30초마다
  # 최신화할 이유가 없고, 분봉 API 가 1회에 900봉(≈2.3거래일)을 주므로 마감 후
  # 한 번만 불러도 그날치가 통째로 들어온다. 아낀 호출은 감시 주기를 줄이는 데 쓴다.
  realtime_trading_only: true
  # 한 사이클에 분봉을 갱신할 종목 수 상한 (0 = 전부, 종전 동작).
  #
  # **모든 주기의 우선순위는 매매 데스크다**(사용자 결정 2026-07-30). 데스크가
  # 2초를 지키려면 같은 예산을 쓰는 다른 호출을 줄여야 하고, 줄이는 방식은
  # 동시 조회 종목 수를 낮추는 것이다. 실측: 매매 tier 34종목 × 30초 사이클로
  # chart 가 149콜/분까지 올라 API 사용률 90%가 됐고 데스크가 그 큐에 밀렸다.
  #
  # 12면 34종목이 3사이클(≈90초)마다 갱신된다. 보유 종목은 배치 앞에 고정되므로
  # 청산 판정이 걸린 종목은 매 사이클 최신이다.
  backfill_per_cycle: 12
  # 마감 백필 — 감시목록 전체(수집전용 포함)를 1회 호출해 그날 분봉을 확정한다.
  # 장중 루프가 15:30 에 멈춰 그 이후 체결이 저장에 빠지는 것도 함께 메운다.
  # 백테스트 리포트(15:40)보다 앞서야 완결된 데이터로 평가된다.
  eod_backfill: true
  eod_backfill_after: "15:35"
  # 신규 편입 종목 심층 백필(연속조회) — 종목당 1회, 편입 직후.
  # 분봉 API 는 언제 부르든 '최근 900봉(≈2.4거래일)'만 준다. 마감 후로 미뤄도
  # 과거가 늘지 않으므로, 응답 헤더의 next-key 를 물고 되부르는 연속조회로만
  # 과거를 확장할 수 있다. 5페이지 ≈ 4,500봉 ≈ 12거래일이라 편입 당일부터
  # backtest.min_days 를 채운다. 완료 여부는 market.db 의 deep_backfill 에 남아
  # 감시목록에서 빠졌다 재편입돼도 다시 부르지 않는다.
  deep_backfill: true
  deep_backfill_pages: 5        # 종목당 최대 페이지(1페이지=900봉)
  deep_backfill_per_cycle: 3    # 장중 사이클당 종목 수 상한(레이트리밋 방어)
  deep_backfill_eod_max: 30     # 마감 후 회수 상한(장중 실패·상한 초과분)
  roster_enabled: true
  roster_retention_days: 30     # 마지막 감시 후 이 기간까지 계속 수집(초과 시 중단)
  roster_backfill_max: 200      # 이탈 종목 1회 백필 상한(레이트리밋 방어)
  # 마감 후 **유동성 유니버스** 분봉 백필 상한(거래대금 순). 0 = 끔.
  #
  # 실측 2026-07-31: 1분봉 보유 395종목 / 일봉 3,941종목. 장중 차트 지표는
  # 그 395개에만 계산할 수 있어 "전체 종목 베이스 + 장중 지표" 가 양립하지
  # 않았다. 406 은 기술적 상한이 아니라 대상 집합이었다 — 마감 백필이
  # 감시목록 + 로스터만 훑었을 뿐이다.
  #
  # 예산: ka10080 은 1콜에 900봉(≈2.4거래일)을 주므로 종목당 1콜이면 하루가
  # 통째로 덮인다. 4 rps 에서 400종목 ≈ 100초, 1,165종목(유동성 전량) ≈ 5분.
  # 15:35 부터 야간 발굴(17:30)까지 예산은 통째로 비어 있으므로 장중 경합이
  # 없다. 우선 400 으로 시작해 소요 시간을 보고 올린다.
  eod_universe_max: 400

# 주간 기법 스윕 — 매주 토 09시(KST) 전 규칙 격리 백테스트 성적표(rule_sweep.json)
sweep:
  enabled: true
  weekday: 5                  # 0=월 … 5=토
  hour: 9

# 분봉 축적분 주기 백테스트 리포트 (평일 장 마감 후 1회, 결과 스냅샷 보관)
backtest:
  # 종목당 평가 창 상한(봉). 심층 백필로 봉이 늘고 keep_days 만큼 계속 쌓이므로
  # 상한이 없으면 리포트 비용이 무한정 커진다. 8000봉 ≈ 최근 21거래일.
  max_bars: 8000
  # 0 = 자동(코어 수 − 2, 최대 6). 종목 간 의존이 없어 그냥 나뉜다.
  # 순차로는 196종목 × 26.5초 = 87분이라 오프로드 한도를 넘겼다(실측).
  workers: 0
  report_enabled: true
  min_days: 3                   # 리포트 대상 최소 분봉 축적일수
  keep_days: 120                # 분봉 보관 일수(초과분 정리 — 디스크 방어)
  run_after: "15:40"            # 장 마감 후 실행 시각(KST)

# 매매일지 — 평일 마감 후 하루치 경과를 집계해 누적 보관한다.
# 수치·요인 추출은 결정론 코드가 하고, LLM 은 그 사실을 문장으로 엮기만 한다.
journal:
  enabled: true
  run_after: "15:45"            # 청산 정리(15:30~) 이후여야 그날 결과가 다 담긴다
  llm_role: general             # llm-gateway 역할 (trading 토큰 허용: summarize/general)
  llm_timeout_sec: 150          # 요약 대기 상한 — 대시보드 프록시(180초)보다 짧게
  signal_keep_days: 180         # signal_log 보관 일수(초과분 정리)

risk:
  # 완전 자동 발주 — 신호를 승인 없이 즉시 발주하고, 목표 도달 청산도 자동 실행.
  # 소액 계좌 + 안전장치(일일 손실한도 중단·손절 자동청산·최대 3포지션·리스크
  # 사이징·TTL) 전제. UI(일일 목표·가드 카드)에서 켜고 끌 수 있다.
  auto_approve: true
  long_only: true             # 롱 전용 — 현물 계좌는 개별주 공매도 불가, 숏 신호 미발주
  risk_per_trade_pct: 0.5     # 1회 손절 시 계좌 대비 최대 손실 %
  daily_target_pct: 1.0       # 일일 목표 % (도달 시 이익 확정·신규 진입 중단) — UI에서 변경
  daily_loss_limit_pct: 2.0   # 일일 누적 손실 한도 % (도달 시 신규 진입 중단) — UI에서 변경
  max_positions: 3
  signal_ttl_min: 10          # 승인 대기 신호 만료(분)
  # 한 종목이 계좌에서 차지할 수 있는 최대 비중(%). 0 = 상한 없음.
  # 없으면 손절폭이 좁은 신호일수록 수량이 커져 장 초반 한두 건이 예수금을 다
  # 써 버리고(실측: 첫 2건이 85%), 이후 신호는 전부 '잔고 부족'으로 밀린다.
  max_position_weight_pct: 20
  # 일일 손실 가드 임시 해제 — 한도에 걸려도 수동 승인으로 내려가지 않고
  # 자동 매매를 이어갈 때 쓴다. 안전장치를 스스로 여는 기능이라 상한을 둔다.
  # 둘 중 하나라도 0이면 기능 자체가 꺼진다. 오늘만 유효하고 시간 만료도 있다.
  guard_override_max_pct: 2.0   # 하루에 추가로 허용할 손실 총량(%) 상한
  guard_override_max_count: 2   # 하루 임시 해제 횟수 상한
  # 한 종목에는 한 포지션만. 규칙이 다르면 각각 진입해 같은 종목의 같은 하락을
  # 두 번 맞는다(실측 2026-07-27: 신일전자 momentum + pullback 둘 다 손절).
  # 비중 상한도 규칙별로 따로 계산되므로 이게 없으면 한 종목에 2배까지 들어간다.
  one_position_per_symbol: true
  # 손실 한도 판정에 **평가손익을 함께 센다**. 종전에는 실현분만 봐서, 물려 있는
  # 포지션이 아무리 깊어도 가드가 침묵했다 — 실측 2026-07-30, 한도 1.5% 인 날
  # 계좌는 -4.26% 까지 갔다. 이익 목표는 여전히 실현분만 본다(아직 손에 쥐지
  # 않은 돈으로 그날 장사를 접을 수는 없다). false 로 두면 종전 동작.
  guard_include_unrealized: true
  # 보유분 정리선(%) — 신규 진입 차단(daily_loss_limit_pct)보다 한 단계 위다.
  # "더 벌이지 않는다" 와 "지금 다 접는다" 는 다른 결정이라 문턱을 나눠 둔다.
  # **0 = 꺼짐이 기본값**이다. 켜면 실거래 청산이 자동 발주되므로, 값을 넣는 것은
  # 사용자의 판단이다(배포는 경로만 만들고 활성화는 분리한다 — 데스크와 같은 규약).
  daily_loss_flatten_pct: 0

rules:
  # 진입 시간창 게이트 — 시간대 분석(2026-08-01, 합성 7,094체결/590종목) 근거.
  # 신호는 전부 기록되고 **발주만** 차단된다(비발주 사유가 화면·일지에 남는다).
  # 15:00 이후 신규 진입은 eod 강제 청산 비중 71% — 목표까지 갈 시간이 없다.
  entry_cutoff: "15:00"
  # 손절폭 대역(%) — 양쪽 끝이 모두 손해다. 규칙 블록에 같은 키를 두면 그 값이 우선.
  #
  # 하한: 왕복 비용(수수료 0.03 + 거래세 0.15 + 슬리피지 0.10 = 0.28%)을 이겨야 한다.
  #   목표가 1.5R 일 때 승률 50% 기준 기대값이 양수이려면 손절폭 > 1.12% 가 필요하다.
  #   실측 2026-07-27: 손절폭 0.31% → 목표 0.47% → 목표에 닿고도 -0.03%.
  # 상한: 목표(target_r × 손절)가 하루 변동폭 안에 들어와야 닿는다.
  #   실측: ORB 손절폭이 일중 변동폭의 48~73% → 목표는 변동폭의 72~110% → 도달 0건.
  #   일중 변동폭 5% 대에서는 손절폭 2.5% 가 사실상 상한이다.
  # 0 이면 그 방향은 미적용.
  min_stop_pct: 1.0
  max_stop_pct: 2.5
  # 체결 후 재검증 — 위 대역 검사는 **모델 진입가**로 한다. 체결가는 그 뒤에
  # 정해지고, 슬리피지가 폭을 대역 밖으로 밀어낸다. 실측 2026-07-27~31:
  # 107건 중 17건이 체결 후 대역 밖(최대 0.94%p 이탈). 켜 두면 체결 확정 시점에
  # 폭을 다시 재고, 대역 밖일 때만 경계로 당긴 뒤 원 손익비로 목표를 다시 만든다.
  # 대역 안이면 손절선을 건드리지 않는다(구조적 수준 보존).
  refit_stop_on_fill: true
  # 돌파 확인 — 진행 중인 현재 분봉에서 나온 신호는 발사하지 않고 봉 마감을 기다린다.
  # 키움 분봉 응답은 형성 중인 봉을 현재가를 종가로 해서 함께 주므로, 켜지 않으면
  # '찍고 되밀린 가짜 돌파'에도 반응한다(감시 주기가 짧을수록 심해짐). 신호는
  # 하루 한 번만 발사되므로 가짜 돌파 한 번이 그날의 기회를 소진한다.
  # 개별 규칙 블록의 confirm_on_close 가 이 값을 덮어쓴다. UI(기어 모달)에서 전환 가능.
  confirm_on_close: true
  # 최대 보유 시간(분). 0 이면 끔. 규칙 블록에 같은 키를 두면 그 값이 우선한다.
  # 인트라데이 셋업은 첫 30분 안에 결판난다 — 오래 끌수록 원래 논리는 사라지고
  # 자금만 묶인다(실측 2026-07-27: 60분 이상 보유 5건 전패 vs 8분 승리 1건).
  # 도달 시 현재가로 시장가 정리(손절과 같은 취급).
  max_hold_min: 45
  orb:
    enabled: true
    priority: 1.0             # 발주 우선순위 가중치 — 자체 검증 기대값 +0.44R(최고)
    max_hold_min: 30          # 시초 범위 돌파는 첫 30분이 승부
    range_start: "09:00"
    range_end: "09:15"
    target_r: 1.5             # 목표가 = 손절 거리의 1.5배
    # 범위 필터 — 자체 데이터 스윕 검증(47종목): 기본 59.7%/+0.25R → 필터 후
    # 64.0%/+0.44R. 너무 좁은 범위(노이즈)·너무 넓은 범위(손절 과대) 배제.
    min_range_pct: 1.0
    # **3.5 유지 — 같은 날 2.5 로 내렸다가 되돌렸다.**
    #
    # 내린 근거는 실거래 11건에서 목표 도달 0건이었다는 것이었다. 그 뒤 전
    # 유니버스로 다시 재니 방향이 반대였다(5거래일, 비용 차감, 목표 1.5R):
    #     범위 <= 3.5%  건당 -0.033%  승률 44.1%  n=286
    #     범위 <= 2.5%  건당 -0.203%  승률 38.7%  n=119
    # 목표 도달률 자체는 개선된다(15.0% -> 16.0%). 좁히는 논리는 맞았지만
    # 표본을 줄이면서 남은 표본의 질이 더 크게 떨어졌다. 11건으로 정한 값을
    # 286건이 뒤집었으므로 되돌린다.
    max_range_pct: 3.5
    # RVOL — 돌파봉 거래량 / 개장 범위 봉 평균. 범위 필터보다 이쪽이 강했다.
    # 필터 없음 -0.251% / RVOL >= 1.5 **+0.194%** (유일한 양수 변형, n=668).
    # 승률 41.7% -> 49.0%. 문헌이 보고한 개선폭(8~12%p)과 같은 자릿수다.
    # 0 이면 미적용.
    #
    # **설정에 넣은 정확한 조합을 따로 쟀다**(범위 1.0~3.5 + RVOL 1.5):
    #     배포 전 (1.0~3.5, RVOL 없음)   -0.033%  승률 44.1%  n=286
    #     낮에 넣었던 (1.0~2.5)          -0.203%  승률 38.7%  n=119
    #     **이 설정 (1.0~3.5 + RVOL 1.5)  +0.098%  승률 48.4%  n=250**
    #     범위 무제한 + RVOL 1.5         +0.195%  승률 49.0%  n=669
    #
    # 범위 상한을 아예 없애는 쪽이 더 좋게 나온다. 그리고 상한은 손절폭 대역
    # (max_stop_pct 2.5)과 상당 부분 겹친다 — orb 손절폭이 곧 범위 폭이므로
    # 넓은 범위는 대역 필터가 어차피 거른다. 그럼에도 3.5 를 유지하는 이유는
    # **같은 값을 하루에 두 번 바꾸지 않기 위해서다.** 5거래일 표본으로 오전에
    # 내렸다가 오후에 되돌린 값을, 같은 표본으로 다시 올리는 것은 측정이 아니라
    # 추종이다. 4주 관측 뒤에 함께 판정한다.
    #
    # 날짜별로는 여전히 불안정하다(-0.397% ~ +0.867%, 승률 31.6% ~ 73.6%).
    # 방향과 문헌이 일치하고 표본이 더 크다는 근거로 넣는 것이지, 엣지가
    # 입증된 것이 아니다.
    min_rvol: 1.5
    # 시간대 필터 — 자체 검증: 9시 73%/+0.58R, 10시 55.6%/+0.34R, 11시 이후 전패.
    entry_before: "11:00"
  gap:
    enabled: true
    priority: 0.5             # 발주 우선순위 — 검증 표본 부족(중립)
    min_gap_pct: 1.0          # 시가 갭 최소 크기(2.0→1.0 완화 — 갭 종목 더 포착)
    range_wait_until: "10:00" # 첫 1시간 범위 형성 대기
    trail_long_pct: 8.0
    trail_short_pct: 4.0
  # 모멘텀 돌파(롱) — VWAP 위에서 직전 N봉 고가 돌파. 첫 시간 한정 셋업.
  momentum:
    enabled: true
    priority: 0.6             # 발주 우선순위 — 자체 검증 기대값 +0.27R
    max_hold_min: 30          # 첫 시간 한정 셋업 — 길게 끌 이유가 없다
    # 시간대 필터 — 자체 검증: 9시 58.2%/+0.27R(약세장 표본 포함), 10시 이후 음수.
    # 첫 시간으로 한정하면 약세장에서도 유효 → 국면 제한 대신 시간창으로 게이트.
    entry_before: "10:00"
    lookback: 20              # 돌파 판단용 직전 봉 수
    stop_lookback: 5          # 손절용 최근 저점 봉 수(타이트)
    atr_stop_mult: 0.5
    atr_period: 14
    target_r: 1.5
  # 눌림목(롱) — 상승추세에서 20MA 되돌림 후 반등 양봉. 국면 연동(위와 동일 근거).
  pullback:
    enabled: true
    priority: 0.5             # 발주 우선순위 — 검증 표본 부족(중립)
    regimes: ["강세", "중립"]
    # 늦은 오전 눌림목 차단 — 시간대 분석(2026-08-01): 이 창의 pullback 이
    # 합성 n=1,086 · 평균 −0.65R 로 시간대 손실의 최대 덩어리였다(승률 22~27%).
    # 실거래 11:00 버킷(승률 11%)과 방향 일치. 차단 시 전체 평균 R −0.374→−0.325.
    no_entry: ["10:00-11:30"]
    near_pct: 0.4             # 20MA 근접 허용(%)
    # 종전에는 코드에 40 이 박혀 있었다. 값은 그대로 두고 **보이게만** 한다 —
    # 이 규칙이 09:40 이전에 한 번도 평가되지 않는다는 사실이 설정 어디에도
    # 드러나지 않았다. 실측: 09:03 진입 +0.697% vs 09:30 -0.524%(비용 전)인데
    # 우리 실거래 107건 중 09:15 이전 진입은 0건이다.
    # 창을 열지 말지는 개장 창 관측(scout.observe.opening) 4주 뒤에 정한다.
    min_bars: 40
    stop_lookback: 5
    atr_stop_mult: 0.5
    atr_period: 14
    target_r: 1.5
  # RSI 급락 눌림(롱) — Connors RSI-2 계열의 장중 적응(주식 승률 75%+ 문헌 엣지).
  # 연구 후보(주간 스윕 검증 후 활성).
  # 상승 다이버전스(롱) — 연구 문서 §2.2 반영(2026-08-01). **기본 꺼짐** —
  # 두 문서가 공통 권고했지만 우리 데이터에서 측정된 적이 없다. 켜기 전에
  # 주간 스윕 성적을 볼 것(같은 평균회귀 계열 rsi_dip 은 -0.66R 로 꺼졌다).
  divergence:
    priority: 0.30          # rsi_dip 과 같은 급 — 측정 전이라 근거 없이 못 올린다
    enabled: false
    lookback: 30            # 저점 두 개를 찾는 창(분봉)
    min_bars: 60
    rsi_period: 14          # 문서 기준(14) — rsi_dip 의 단기(3)와 다른 축
    min_price_gap_pct: 0.15 # 가격 저점이 이만큼은 낮아져야 LL 로 본다
    min_rsi_gap: 3.0        # RSI 저점은 이만큼 높아져야 HL 로 본다
    rsi_low_max: 45         # 저점다운 영역에서만 — 중립대 교차는 소음
    atr_stop_mult: 0.5      # 손절 = 다이버전스 저점 − ATR 여유
    atr_period: 14
    target_r: 1.5
  rsi_dip:
    priority: 0.30          # 발주 우선순위(스윕 −0.66R)
    enabled: false
    rsi_period: 3
    oversold: 15              # 직전 봉 RSI 가 이 이하로 급락했을 때
    min_bars: 40
    stop_lookback: 5
    atr_stop_mult: 0.5
    atr_period: 14
    target_r: 1.5
  # 갭필 평균회귀(롱) — 갭하락 후 반전 확인 시 전일종가까지 되메우기 목표.
  # 문헌 검증 엣지(지수·대형주 ~0.5%/건). 연구 후보(우리 데이터 검증 후 활성).
  gap_fill:
    priority: 0.25          # 발주 우선순위(스윕 표본 0)
    enabled: false
    min_gap_pct: 1.0          # 갭하락 최소 크기(%)
    confirm_bars: 5           # 반전 확인용 초반 봉수(이 고가 돌파 시 진입)
    min_rr: 1.0               # 남은 갭 ÷ 손절거리 최소 배수
    min_bars: 10
    atr_stop_mult: 0.5
    atr_period: 14
  # VWAP 되찾기(롱) — VWAP 아래 체류 후 위로 복귀+양봉. 연구 후보(데이터 검증 후 활성).
  vwap_reclaim:
    priority: 0.35          # 발주 우선순위(스윕 −0.43R)
    enabled: false
    min_bars: 30
    below_lookback: 15        # 최근 N봉 중
    min_below_bars: 5         # VWAP 아래 체류 최소 봉수(스침 배제)
    vol_ratio: 0              # 0=거래량 확인 끔 / 예:1.2 = 세션평균×1.2 이상
    stop_lookback: 5
    atr_stop_mult: 0.5
    atr_period: 14
    target_r: 1.5
  # 박스 돌파 리테스트(롱) — 상단 돌파 후 되돌림 지지. 연구 후보(데이터 검증 후 활성).
  range_break_retest:
    priority: 0.20          # 발주 우선순위(스윕 −1.63R)
    enabled: false
    range_lookback: 60
    retest_tolerance_pct: 0.3
    atr_stop_mult: 0.5
    atr_period: 14
    target_r: 1.5
  # 반등 페이드 — 딥리서치 검증 결론(하락장 단타의 추세 정렬 방향)을 코드화한 규칙.
  # 숏 전용 규칙 → 롱 전용 모드에선 발주되지 않으므로 비활성(신호 산출도 생략).
  bounce_fade:
    priority: 0.25          # 발주 우선순위(스윕 표본 0)
    enabled: false
    rsi_hot: 60               # 반등 과열 하한 (딥리서치: RSI 60~70 도달이 매도 기회)
    rsi_max: 100              # 반등 과열 상한 (필요 시 70 으로 좁힘)
    lookback: 30              # 저점 갱신 구조 확인용 봉 수
    candle_confirm: reversal  # reversal=하락장악/유성 확인 / any=단순 음봉
    atr_stop_mult: 0.5        # 손절 = 반등고점 + 0.5×ATR (스탑 헌팅 회피, 딥리서치 6단계)
    atr_period: 14
    require_downtrend: true   # 1단계 추세 게이트: 일봉 하락(역배열/장기선 하회)일 때만
    require_volume_dry: false # 반등 거래량 소진 조건(옵션)
  breakdown_retest:              # 숏 전용 규칙 → 롱 전용 모드에선 비활성
    priority: 0.25          # 발주 우선순위(스윕 표본 0)
    enabled: false
    support_lookback: 60      # 지지선 산출용 봉 수
    retest_tolerance_pct: 0.3
    atr_stop_mult: 0.5        # 손절 = 지지선 + 0.5×ATR
    atr_period: 14
    require_downtrend: true   # 1단계 추세 게이트
    # 하방 이탈 거래량 확인 — 딥리서치에서 '평균 120% 필터'는 근거 부족으로 기각됨.
    # 하드코딩하지 않고 선택 사용(기본 OFF). 켜면 vol_confirm_ratio 로 강도 조절.
    require_volume: false
    vol_confirm_ratio: 1.2

# 통합 종목 발굴 엔진 — 여섯 소스를 하나의 통로로 모은다.
# 모드는 data/engine.json 런타임 오버라이드가 우선한다(배포 없이 되돌리기 위해).
# 여기 값은 기본값일 뿐이고, 화면의 모드 전환이 오버라이드 파일을 쓴다.
scout:
  enabled: true
  # 2026-08-01 완전 통합: shadow(7/27)→3거래일 관찰→full 로 올라온 상태를
  # 성문화한다(실서버 engine.json 이 이미 full 이었다). 기존 직접 편입 경로는
  # 코드째 삭제됐으므로 **shadow 는 이제 '감시목록 동결' 을 뜻한다** — 기록만
  # 하고 아무도 쓰지 않는다. 킬 스위치 성격이다.
  mode: full                  # shadow(기록만·목록 동결) | collect | full
  # --- 승격·강등 ---
  # 매매 tier 승격에 점수 임계가 없는 것은 의도다. 점수 순 상위 N 이 매수가능
  # 무작위보다 0.22R 나빴다(2026-07-27 실측, 191거래일 / 3,907종목).
  # 매매는 게이트로만 연다 — 유동성 · 체결가능성 · probation · 상한.
  promote_collect: 0.35       # 이상 → 수집전용 후보
  demote_below: 0.25          # 미만 → 감시목록에서 제거 (승격선보다 낮다 = 히스테리시스)
  min_dwell_min: 15           # 최소 체류 — 들락날락·WS 재구독 폭주 방지
  probation_sessions: 1       # 매매 승격 전 수집 tier 체류 세션
  # 매매 tier 상한. **레이트리밋에서 유도한 값이다**(설계 검토 6번).
  # 실측 2026-07-29: 매매 tier 44종목 → 분봉 백필 45콜 → 버스트 17~19초 →
  # 신호 사이클이 40~50초로 벌어졌다(설정은 20초). 종목당 ≈0.4초이므로
  # scan_interval_sec 20초의 절반을 백필에 쓰면 **25종목**이 상한이다.
  # 50 은 그 근거 없이 잡혀 있던 값이다.
  # **2026-07-31 재산정: 25 → 40.** 위 유도의 전제가 사라졌다.
  # 7/30 `collection.backfill_per_cycle: 12`(라운드로빈)를 넣어 매 사이클 12종목만
  # 백필하므로, 매매 tier 가 늘어도 **사이클당 콜 수는 12로 고정**이다. 제약이
  # API 부하에서 **분봉 갱신 주기**로 바뀌었다:
  #     25종목 → 3사이클 60초 · 40 → 4사이클 80초 · 60 → 5사이클 100초
  # 실측 2026-07-31 평균 보유 약 14분 대비 +20초는 2.4%다. 그리고 이 지연은
  # **진입 신호 탐지에만** 걸린다 — 청산은 데스크가 2초 주기로 WS 가격을 보고
  # 판정하므로 분봉을 쓰지 않는다.
  #
  # 40 인 이유: 보호(보유) 자리를 빼고도 회전 여지가 충분해야 한다. 50~60 은
  # 지연이 100초로 뛰는데(+40초) 그만큼 자리를 더 얻는 효용이 확인되지 않았다.
  max_trade: 40               # 매매 tier 상한
  max_total: 120              # 감시목록 전체 상한
  # --- 기회비용 회전 (2026-07-31) ---
  # 자리를 받고 이만큼 지나도록 신호가 한 건도 없으면 대기 후보에게 넘긴다.
  #
  # **성과 기반 강등이 아니다.** 종목의 과거 손익은 다음 거래를 예측하지 않는다
  # (실측: 상관 −0.050 · n=57 · t=−0.37. 손실 이력 종목의 다음 거래 −0.611% vs
  # 이익 이력 −0.607%, 차이 0.004%p). 그 위에 규칙을 세우면 노이즈를 따라가는
  # 것이다 — 1.5단계에서 랭킹 6종이 전부 무작위보다 나빴던 것과 같다.
  #
  # 대신 신호 유무로 판정한다. 실측 2026-07-31: 매매 tier 40종목 중 16종목(40%)이
  # 그날 신호 0건이었고 매매 tier **밖에서 나온 신호는 0건**이었다 — 자리가
  # 모자라 놓친 기회는 없고, 앉아 있는 종목이 신호를 안 낸다. 발굴 소스는 5일간
  # 고유 1,000종목 이상을 지목했는데 실제로 거래된 것은 50종목이다.
  #
  # **경쟁이 있을 때만 돈다** — 자리가 남거나 대기 후보가 없으면 회전하지 않는다.
  silent_dwell_min: 390       # 1거래일. 0 이면 회전 끔
  silent_cooldown_min: 390    # 밀려난 뒤 재승격 금지(없으면 즉시 복귀해 무의미)
  max_rotate: 3               # 사이클당 회전 상한 — 소스 장애로 인한 대량 회전 방어
  max_demote: 10              # 상한 초과 강등의 사이클당 상한 — 매매 tier 일괄 붕괴 방어
  # 매매 승격 금지 핀(사용자 지시 2026-08-03) — 수집전용까지만, 신호·관측은 유지.
  # **성과 기반 자동 강등이 아니다**(측정 기각: 과거 손익→다음 거래 상관 −0.050,
  # 2026-07-31). 사용자가 장부를 보고 지정한 것이며 해제도 사용자가 한다.
  # 선정 기준(2026-08-03 장부, 투명성 기록): 청산 3건 이상 · 0승 · 누적 −3,000원
  # 이하 — 007810 코리아써키트(6건 0승 −9,307) · 073240 금호타이어(6건 0승
  # −8,995) · 093370 후성(3건 0승 −4,806) · 131970 테스나(3건 0승 −4,526).
  # 이들의 과대 손실 다수가 손절 관통(계획 −1.5%대 → 실현 −3~−4%)이었다 —
  # 원인 요법(관통 특성 게이트)은 별도 측정 진행 중(measurement.md).
  no_trade: ["007810", "073240", "093370", "131970"]
  # --- 외국인/STV 수급 소스 (2026-08-03 편입, 사용자 승인) ---
  # 이 시스템에서 두 관문(IC 재현 t=4.9 · 랭킹 하네스 vs_liquid 전 손절폭
  # +0.040~+0.056R)을 모두 통과한 **최초의 선별 신호**다. 그래도 관측 전용
  # (max_tier=collect, 코드 하드 룰)이다 — 효과 크기가 작고(+0.05R/건) 표본이
  # 99일 하락 편중이라, 4주 실측 전에는 이 소스 단독으로 매매 tier 에 못
  # 올라간다. API 콜 0 — 야간 배치가 채운 flow_obs 를 읽기만 한다.
  flow:
    enabled: true
    top_n: 5                  # frgn_stv 양수 상위 N — 하네스와 동일값(드리프트 금지)
  # --- 관측 전용 (2026-07-31) ---
  # 소스가 **아니다.** 신호를 내지 않고 원장에만 쌓인다 — 점수·승격 경로에
  # 닿지 않는다. 기관 순매수가 좋은 신호인지 나쁜 신호인지 측정된 적이 없고,
  # 5거래일 표본에서 코리아써키트는 +20.65% 인 날 기관 순매수가 -2,765 였다
  # (그리고 우리는 -5,127 을 잃었다). 표본 하나로는 아무 말도 못 한다.
  # 발굴 3규칙 점수도 '그럴듯해서' 들어갔고 1년 뒤 베타 프록시로 판명됐다.
  #
  # 4주 뒤 잔차 IC 가 본페로니 문턱을 넘으면 그때 소스로 승격한다. 못 넘으면
  # 이 계열도 폐기한다. 결과를 본 뒤 문턱을 낮추지 않는다.
  #
  # 예산: 두 TR 모두 1콜에 대량을 준다(투자자별 800종목 · VI 100종목).
  # 120초 주기면 **분당 1콜** — 현재 분당 150~250콜 대비 무시할 수 있다.
  observe:
    enabled: true
    interval_sec: 120
    investor: true            # ka10063 장중 투자자별 매매
    invsr: "6"                # 6 외국인 / 7 기관계
    vi: true                  # ka10054 VI 발동종목
    # 개장 창(09:00~09:15) 시장 상태 — 하루 한 행. **API 호출 0**(저장된 분봉).
    #
    # 실측 2026-07-31: 진입 시각별 09:30 청산 수익(비용 전)이 개장 직후에 몰린다.
    #     09:02 +0.724% · 09:03 +0.697% · 09:15 +0.033% · 09:30 -0.524%
    # 그런데 우리 실거래 107건 중 09:15 이전 진입은 **0건**이다 — 규칙의 봉
    # 요구량이 정확히 그 창을 막는다.
    #
    # **그래도 창을 열지 않는다.** 같은 거래를 날짜별로 쪼개면 분산이 엣지의
    # 4배다(7/28 -1.553% 승률 17.9% ↔ 7/30 +1.932% 승률 75.6%). 종목 선택
    # 엣지가 아니라 그날 시장 방향이고, 손절을 거는 순간 사라진다
    # (손절 없음 +0.385% → 1.0% 손절 -0.034%). 5일로 규칙을 만들면 1.5단계에서
    # 폐기한 실수를 반복한다.
    #
    # 4주 뒤 물을 것: "개장 창 진입 성적이 이 값들로 갈리는가." 갈리면 시장
    # 방향 필터가 분산을 줄인다는 뜻이고, 안 갈리면 이 창은 그냥 베타다.
    opening:
      enabled: true
      min_symbols: 30         # 표본 미달인 날은 남기지 않는다(다른 날과 같은 무게로 읽힌다)
    # NXT(넥스트레이드) 프리마켓 — **우리가 못 보던 한 시간**.
    #
    # stex_tp 를 실호출로 확정했다(2026-07-31): 1=KRX · 2=NXT · 3=통합.
    # 순위 3종·관측 2종·주문·잔고가 전부 KRX 였다. NXT 는 08:00 부터 실제
    # 체결이 일어난다(프리 08:00~08:50 · 메인 09:00:30~15:20 · 애프터 15:30~20:00).
    #
    # 이게 앞선 측정과 이어진다. 진입 시각별 09:30 청산 수익이 09:02 +0.724% ·
    # 09:15 +0.033% 로 개장 직후에 몰렸는데, **그 시점에 가격 발견은 이미 한
    # 시간 진행돼 있었다.** KRX 동시호가의 예상체결과는 성격이 다르다 — 그건
    # 미체결 호가의 추정이고 이쪽은 실제 체결이다.
    #
    # 관측만 한다. 주문은 여전히 KRX 로 나간다(dmst_stex_tp 는 안 건드린다).
    # 창을 바꾸면 애프터마켓(15:30~20:00)도 같은 코드로 볼 수 있다.
    # 예산: 1콜에 100종목, 120초 주기면 프리마켓 50분에 약 25콜. 그 시간대에는
    # 다른 루프가 전부 자고 있다(장중 소스는 09:00~15:30 게이트).
    # 수급 — 누가 샀고 누가 팔았나. 마감 후 1회, 판단에 쓰지 않는다.
    #
    # 실호출로 확인(2026-07-31): 수급 계열 TR 15개가 열려 있고, 그중 `ka10086`
    # (일별주가)이 **OHLCV 에 개인·기관·외국인 순매수 + 프로그램매매 +
    # 외국인 지분율 + 신용비율을 한 콜에** 얹어 준다. 프로그램(ka90004)·
    # 신용(ka10013)을 따로 부르려던 계획이 그래서 사라졌다 — TR 3개를 아꼈다.
    #
    # `universe`  전종목(유동성 통과분). 야간 발굴 루프에 얹혀 종목당 1콜이
    #             더 붙는다 — 배치가 약 16분 → 33분. 끄면 감시목록만 남는다.
    # 나머지 셋은 `ka10086` 이 못 주는 축이고 **감시목록으로 한정**한다.
    # 전종목까지 넓히지 않는 이유는 콜이 아니라 질문이다 — 답해야 할 것은
    # "우리가 산 종목의 수급이 어땠나" 이고 그건 감시목록이면 답이 된다.
    #   ka10059  기관 세부 13주체(금융투자·보험·투신·연기금·사모 …)
    #   ka10014  공매도량·비중·평균가
    #   ka10015  장전/장중/장후 거래량 비중
    #            (실측 삼성전자 7/30: 장전 0.00% · 장중 99.24% · 장후 0.75% —
    #             NXT 프리마켓 관측이 어느 종목에서 의미 있는지를 이 값이 가른다)
    #
    # 예산: 감시목록 120종목 × 3콜 = 360콜, 4 rps 에서 약 90초. 마감 후라
    # 경합이 없다. `eod_backfill_after`(15:35) 뒤에 두어 백필과 겹치지 않게 한다.
    flows:
      enabled: true
      after: "15:50"
      universe: true            # 전종목 ka10086 (야간 발굴에 병행)
      universe_days: 3          # 종목당 저장할 최근 일수(응답은 20일치)
      lookback_days: 10         # 감시목록 세부 조회 기간
      max_symbols: 200
    premarket:
      enabled: true
      start: "08:00"
      end: "08:50"
      interval_sec: 120
    # KRX 장전 동시호가 예상체결 관측 (2026-08-03, 사용자 요청).
    # NXT 프리마켓(실체결)이 못 보는 축 — "09:00 시가가 어디서 열릴 것 같은가".
    # ka10095 가 exp_cntr_pric 를 같은 행에 주므로 추가 TR 이 없다.
    # 예산: 유니버스(감시목록+당일 프리마켓, 상한 200) / 80종목·콜 = 사이클당
    # ≤3콜 × 120초 주기 × 30분 창 = 하루 ≤45콜. 그 시간대 다른 루프는 잔다.
    # 판정(4주, 2026-09-01경)은 preopen.py docstring 에 사전 확정.
    preopen:
      enabled: true
      start: "08:30"
      end: "09:00"
      interval_sec: 120
      max_symbols: 200
      market: "000"           # 000 전체 / 001 코스피 / 101 코스닥
    # KRX 장전 동시호가 예상체결 관측 (2026-08-03, 사용자 요청).
    # NXT 프리마켓(실체결)이 못 보는 축 — "09:00 시가가 어디서 열릴 것 같은가".
    # ka10095 가 exp_cntr_pric 를 같은 행에 주므로 추가 TR 이 없다.
    # 예산: 유니버스(감시목록+당일 프리마켓, 상한 200) / 80종목·콜 = 사이클당
    # ≤3콜 × 120초 주기 × 30분 창 = 하루 ≤45콜. 그 시간대 다른 루프는 잔다.
    # 판정(4주, 2026-09-01경)은 preopen.py docstring 에 사전 확정.
    preopen:
      enabled: true
      start: "08:30"
      end: "09:00"
      interval_sec: 120
      max_symbols: 200
    # 저장 분봉 기반 마감 관측 — 매물대(§3.2)·VPIN(§6). **API 콜 0** —
    # 재료가 전부 DB 의 1분봉이다. eod_backfill(15:35)이 봉을 확정한 뒤 돈다.
    # 관측 전용: 4주 뒤 질문은 "진입가의 매물대 위치가 실현 R 과 상관있나" ·
    # "높은 VPIN 날의 다음 날이 실제로 나빴나".
    bars:
      enabled: true
      after: "15:55"
      profile_days: 10        # 매물대 계산 창(일) — 지지·저항은 하루로 안 선다
      bins: 24                # 가격대 칸 수
      vpin_buckets: 50        # 원 논문 관례값
      max_symbols: 200
  # 시간당 발굴 관측 (2026-08-03, 사용자 승인 — scout/hourly.py 판정 docstring).
  # 야간 3규칙을 진행 중인 오늘 봉(스냅샷 합성)으로 매시 재평가해 "장중에
  # 새로 생긴 패턴"(전일 점수 < min_score → 지금 ≥)만 원장에 남긴다. 관측
  # 전용 — 신호·편입에 닿지 않는다. 소스 편입은 4주 판정(익일 실현 R vs
  # 정합 대조군 + 기존 소스 중복률 <80%) 통과 + 사용자 결정 후.
  # 예산: 786종목/80콜 = 10콜/시간 × 6회 = 하루 ~60콜.
  # 시작 09:30 — 개장 직후 30분은 거래량 일할 환산의 왜곡이 가장 크다.
  hourly:
    enabled: true
    start: "09:30"
    end: "15:00"
    interval_sec: 3600
    min_score: 2              # nightly 와 같은 문턱(드리프트 금지)
    max_picks: 50             # 폭주 안전판 — 넘으면 경고 로그 + 상한만 기록
  news:
    enabled: true
    url: http://127.0.0.1:8602
    # 70 = 폐기된 TNM promote 의 게이트를 계승(2026-08-01 완전 통합). 종전
    # 60 이면 full 전환으로 60~69점·방향미상 항목이 **새로** 편입 후보가 되는데,
    # 그 완화에는 근거가 없다 — 두 채널 중 보수적인 쪽을 남긴다.
    min_score: 70
    limit: 50
    interval_sec: 900

# 연구·검증(매매하지 않음) — 발굴 규칙이 실제로 익일 수익률과 상관이 있는지.
# 머신러닝을 얹기 전에 답해야 할 질문이다. 상관이 없으면 어떤 모델도 소용없다.
research:
  # 왕복 비용%: 수수료 0.015×2 + 거래세 0.20(실측, 아래 costs 참조) + 슬리피지
  # 5bp×2 = 0.33. **0.28 은 거래세 0.15 시절 값이었다** — costs.sell_tax_pct 를
  # 실측으로 올릴 때 여기를 같이 안 올려 하네스가 비용을 0.05%p 덜 잡고 있었다
  # (감사 2026-08-01). 케이스 원장 손익분기선(cases.COST_PCT)과 같은 값이어야
  # 두 측정이 같은 자로 잰 것이 된다.
  cost_pct: 0.33

costs:
  commission_pct: 0.015       # 위탁 수수료(편도)
  # 증권거래세(매도). 실측 2026-07-28 체결내역: 거래세 / 매도금액 ≈ 0.20%
  # (증권거래세 + 농어촌특별세). 0.15 는 과소였다 — 백테스트가 비용을 덜 잡았다.
  # 실거래 원장은 이제 이 값이 아니라 증권사 실부과액을 쓴다(ledger.actual_pnl_krw).
  sell_tax_pct: 0.20
  slippage_bp: 5
